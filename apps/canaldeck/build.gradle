plugins {
    id 'com.android.application' version '9.2.1' apply false
    id 'com.android.library' version '9.2.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
}
subprojects { p ->
    apply plugin: p.name == 'ui' ? 'com.android.library' : 'com.android.application'
    apply plugin: 'org.jetbrains.kotlin.android'
    android {
        namespace p.name == 'ui' ? 'mx.charly.ui' : 'mx.charly.canal'
        compileSdk 37
        buildToolsVersion '37.0.0'
        defaultConfig {
            minSdk 28
            if (p.name == 'app') {
                // Keep the principal app's original identity. Only the offline flavor adds a suffix.
                applicationId 'mx.charly.canal'
                // Literal compiled fuse: no Gradle property, remote config or UI can open it.
                buildConfigField 'boolean', 'PICK_RELAY_REAL_ENABLED', 'false'
                targetSdk 35
                versionCode 6
                versionName '0.4.3-variants-beta'
                ndk { abiFilters 'arm64-v8a', 'x86_64' }
                testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
            }
        }
        if (p.name == 'app') {
            flavorDimensions += 'mode'
            productFlavors {
                normal {
                    dimension 'mode'
                    buildConfigField 'boolean', 'OFFLINE_REHEARSAL_ONLY', 'false'
                    resValue 'string', 'app_name', 'CanalDeck'
                }
                offline {
                    dimension 'mode'
                    applicationIdSuffix '.offline'
                    buildConfigField 'boolean', 'OFFLINE_REHEARSAL_ONLY', 'true'
                    resValue 'string', 'app_name', 'CanalDeck Offline'
                }
            }
        }
        compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
        kotlinOptions { jvmTarget = '17' }
        testOptions { unitTests.includeAndroidResources = true }
        buildFeatures { buildConfig true; resValues true }
        packaging { resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1'] } }
    }
    dependencies {
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.robolectric:robolectric:4.14.1'
    }
}
project(':app') {
    dependencies {
        implementation project(':ui')
        implementation 'dev.g000sha256:tdl-coroutines-android:14.0.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
        androidTestImplementation 'androidx.test:runner:1.6.2'
        androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    }
}
