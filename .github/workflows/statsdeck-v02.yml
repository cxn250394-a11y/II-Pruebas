name: StatsDeck v0.2 | Tests, datos seguidos y APK
on:
  pull_request:
    paths:
      - 'projects/stats/**'
      - 'projects/logic/**'
      - 'projects/ui/**'
      - 'projects/build.gradle'
      - '.github/workflows/statsdeck-v02.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stats-v02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'cxn250394-a11y/II-Pruebas'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: projects
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Contracts and privacy
        run: python3 check-contracts.py
      - name: Logic and Stats JVM, lint, build APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :logic:test :stats:testDebugUnitTest :stats:lintDebug :stats:assembleDebug 2>&1 | tee stats-ci.log
      - name: Verify signature and source
        run: |
          mkdir -p ../stats-v02-artifact
          cp stats/build/outputs/apk/debug/stats-debug.apk ../stats-v02-artifact/StatsDeck-v0.2-beta.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs ../stats-v02-artifact/StatsDeck-v0.2-beta.apk > ../stats-v02-artifact/APK-VERIFY.txt
          cd ../stats-v02-artifact
          sha256sum StatsDeck-v0.2-beta.apk > SHA256SUMS.txt
          git -C .. rev-parse HEAD > SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: statsdeck-v02-apk
          path: stats-v02-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Logs and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statsdeck-v02-tests
          path: |
            projects/stats-ci.log
            projects/logic/build/test-results/test/*.xml
            projects/stats/build/test-results/testDebugUnitTest/*.xml
            projects/stats/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: statsdeck-v02-apk
          path: stats-v02-artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            mkdir -p stats-v02-emulator
            adb install -r stats-v02-artifact/StatsDeck-v0.2-beta.apk > stats-v02-emulator/install.txt
            adb logcat -c
            adb shell am start -W -n mx.charly.stats/.StatsActivity > stats-v02-emulator/start.txt
            sleep 4
            adb shell pidof mx.charly.stats > stats-v02-emulator/pid.txt
            adb exec-out screencap -p > stats-v02-emulator/home.png
            adb shell uiautomator dump /sdcard/stats.xml >/dev/null
            adb pull /sdcard/stats.xml stats-v02-emulator/ui.xml >/dev/null
            adb logcat -d -s AndroidRuntime:E > stats-v02-emulator/crashes.txt
            if grep -q 'FATAL EXCEPTION' stats-v02-emulator/crashes.txt; then cat stats-v02-emulator/crashes.txt; exit 1; fi
            printf 'PASS: StatsDeck APK installed and cold-opened on API35 emulator. No live sports data/POCO notifications tested.\n' > stats-v02-emulator/SUMMARY.txt
      - name: Emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statsdeck-v02-emulator
          path: stats-v02-emulator/
          if-no-files-found: warn
          retention-days: 14
