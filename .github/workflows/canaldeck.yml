name: CanalDeck | Cliente Telegram independiente
on:
  pull_request:
    paths:
      - 'apps/canaldeck/**'
      - '.github/workflows/canaldeck.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canaldeck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/canaldeck
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source and pinned dependency reference
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git -C ../.. rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "SOURCE_HEAD=$EXPECTED_HEAD"
          mkdir -p ../../canal-source
          git -C ../.. rev-parse HEAD > ../../canal-source/SOURCE-COMMIT.txt
          git -C ../.. archive --format=zip HEAD apps/canaldeck .github/workflows/canaldeck.yml > ../../canal-source/source.zip
          curl --fail --location --max-time 90 'https://repo.maven.apache.org/maven2/dev/g000sha256/tdl-coroutines-android/14.0.0/tdl-coroutines-android-14.0.0-sources.jar' -o ../../canal-source/tdl-sources.jar
      - uses: actions/upload-artifact@v4
        with:
          name: canaldeck-source
          path: canal-source/
          retention-days: 14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Privacy and isolation checks
        run: |
          python3 scripts/check-source.py
          python3 scripts/check-relay-offline.py
      - name: Tests, lint, APK and instrumentation test package
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee build-ci.log
          python3 scripts/report-jvm.py
      - name: Verify APK
        run: |
          mkdir -p ../../canal-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../canal-apk/CanalDeck-v0.4-beta.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../../canal-apk/tests.apk
          cd ../../canal-apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs CanalDeck-v0.4-beta.apk > APK-VERIFY.txt
          sha256sum CanalDeck-v0.4-beta.apk > SHA256SUMS.txt
          git -C .. rev-parse HEAD > SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: canaldeck-apk
          path: canal-apk/
          if-no-files-found: error
          retention-days: 14
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canaldeck-tests
          path: |
            apps/canaldeck/build-ci.log
            apps/canaldeck/app/build/test-results/testDebugUnitTest/*.xml
            apps/canaldeck/app/build/reports/lint-results-debug.*
            apps/canaldeck/evidence/*.json
          retention-days: 14
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: canaldeck-apk
          path: canal-apk
      - name: Require APK from this exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat canal-apk/SOURCE-COMMIT.txt)" = "$EXPECTED_HEAD"
          echo "DEVICE_SOURCE_HEAD=$EXPECTED_HEAD"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash apps/canaldeck/scripts/emulator.sh
      - name: Device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canaldeck-emulator
          path: canal-device/
          retention-days: 14
