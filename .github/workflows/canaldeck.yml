name: CanalDeck | Cliente Telegram independiente
on:
  pull_request:
    paths:
      - 'apps/canaldeck/**'
      - '.github/workflows/canaldeck.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canaldeck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/canaldeck
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source and pinned dependency reference
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git -C ../.. rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "SOURCE_HEAD=$EXPECTED_HEAD"
          mkdir -p ../../canal-source
          git -C ../.. rev-parse HEAD > ../../canal-source/SOURCE-COMMIT.txt
          git -C ../.. archive --format=zip HEAD apps/canaldeck .github/workflows/canaldeck.yml > ../../canal-source/source.zip
          curl --fail --location --max-time 90 'https://repo.maven.apache.org/maven2/dev/g000sha256/tdl-coroutines-android/14.0.0/tdl-coroutines-android-14.0.0-sources.jar' -o ../../canal-source/tdl-sources.jar
      - uses: actions/upload-artifact@v4
        with:
          name: canaldeck-source
          path: canal-source/
          retention-days: 14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Privacy and isolation checks
        run: |
          python3 scripts/check-source.py
          python3 scripts/check-relay-offline.py
      - name: Both JVM suites, four APK variants and two instrumentation packages
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:testNormalDebugUnitTest :app:testOfflineDebugUnitTest \
            :app:lintNormalDebug :app:lintOfflineDebug :app:lintNormalRelease :app:lintOfflineRelease \
            :app:assembleNormalDebug :app:assembleOfflineDebug :app:assembleNormalRelease :app:assembleOfflineRelease \
            :app:assembleNormalDebugAndroidTest :app:assembleOfflineDebugAndroidTest 2>&1 | tee build-ci.log
          python3 scripts/report-jvm.py
          python3 scripts/verify-variants.py
          git -C ../.. rev-parse HEAD > app/build/variant-audit/SOURCE-COMMIT.txt
      - name: Package offline APK only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git -C ../.. rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p ../../canal-offline-apk
          cp app/build/outputs/apk/offline/debug/app-offline-debug.apk ../../canal-offline-apk/CanalDeck-v0.4.3-offline-beta.apk
          cp app/build/outputs/apk/androidTest/offline/debug/app-offline-debug-androidTest.apk ../../canal-offline-apk/tests.apk
          git -C ../.. rev-parse HEAD > ../../canal-offline-apk/SOURCE-COMMIT.txt
          cd ../../canal-offline-apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs CanalDeck-v0.4.3-offline-beta.apk > APK-VERIFY.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging CanalDeck-v0.4.3-offline-beta.apk > APK-MANIFEST.txt
          grep -q "package: name='mx.charly.canal.offline'" APK-MANIFEST.txt
          ! grep -q 'android.permission.INTERNET' APK-MANIFEST.txt
          sha256sum CanalDeck-v0.4.3-offline-beta.apk tests.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: canaldeck-offline-apk
          path: canal-offline-apk/
          if-no-files-found: error
          retention-days: 14
      - name: Four-variant audit reports without APK binaries
        uses: actions/upload-artifact@v4
        with:
          name: canaldeck-variant-audit
          path: apps/canaldeck/app/build/variant-audit/
          if-no-files-found: error
          retention-days: 14
      - name: Require runner-built APKs from this exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git -C ../.. rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat ../../canal-offline-apk/SOURCE-COMMIT.txt)" = "$EXPECTED_HEAD"
          test "$(cat app/build/variant-audit/SOURCE-COMMIT.txt)" = "$EXPECTED_HEAD"
          echo "DEVICE_SOURCE_HEAD=$EXPECTED_HEAD"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash apps/canaldeck/scripts/emulator.sh
      - name: Device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canaldeck-emulator
          path: canal-device/
          retention-days: 14
      - name: JVM, lint and build evidence for both flavors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canaldeck-tests
          path: |
            apps/canaldeck/build-ci.log
            apps/canaldeck/app/build/test-results/testNormalDebugUnitTest/*.xml
            apps/canaldeck/app/build/test-results/testOfflineDebugUnitTest/*.xml
            apps/canaldeck/app/build/reports/lint-results-*.*
            apps/canaldeck/evidence/*.json
          retention-days: 14
